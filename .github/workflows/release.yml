name: 构建并发布中文版

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 版本号'
        required: true
        default: 'v2.0.0-zh'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 防止 Electron 被当作纯 Node 运行（本机曾踩此坑），空字符串才是 GUI 模式
      ELECTRON_RUN_AS_NODE: ''
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: VirtualDriverControl/package-lock.json

      - name: 安装依赖
        working-directory: VirtualDriverControl
        run: npm ci

      - name: 构建便携版 exe
        working-directory: VirtualDriverControl
        run: npm run build-portable

      - name: 重命名 exe 为中文名
        working-directory: VirtualDriverControl/dist
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Filter '*.exe' | Select-Object -First 1
          if ($exe) { Rename-Item $exe.FullName '虚拟显示器控制中心.exe' }

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: VirtualDriverControl/dist/*.exe
          name: 虚拟显示器控制中心 ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## 中文图形界面版

            基于 VirtualDrivers/Virtual-Driver-Control 汉化，仅个人使用。

            - 全部界面、进度提示、错误信息已中文化
            - 便携版 exe，无需安装，右键以管理员身份运行
            - 下载后如被 Defender 拦截，请选择"仍要运行"

            **注意**：首次启动会请求管理员权限；如需免提权启动可设置环境变量 `VDD_NO_ELEVATE=1`。
          draft: false
          prerelease: false
